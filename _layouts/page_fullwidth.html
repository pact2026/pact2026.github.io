---
## front matter tells Jekyll to process this as a Liquid template
---

<!doctype html>
<html lang="en">
  {% include head.html %}

  <body>
    <div class="container">
      {% include header.html active='index' %}

      <div class="row mb-3">
        <!-- main page content, full width, no sidebar -->
        <div class="col-12">{{ content }}</div>
      </div>

      {% include footer.html %}
    </div>
    <!-- main container -->
  </body>
</html>
