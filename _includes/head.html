<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png"> -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="{{site.baseurl}}/images/favicon-32x32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="{{site.baseurl}}/images/favicon-16x16.png"
  />
  <link rel="shortcut icon" href="{{site.baseurl}}/images/favicon.ico" />

  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous"> -->
  <link href="{{site.baseurl}}/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    blockquote {
      padding-left: 1em;
      border-left: 1px solid;
    }

    .sidebar-img {
      display: block;
      text-align: center;
      margin-bottom: 1.5em;
      /* border: 1px dotted red; */
    }

    .sidebar-img img {
      display: inline-block;
      max-width: 80%;
      transition: transform 0.2s ease;
    }

    .sidebar-img img:hover {
      transform: scale(1.1);
    }

    .keynote-card {
      border: 1px solid #dee2e6;
      border-top: 4px solid #0d6efd;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .keynote-card.keynote-wed {
      border-top-color: #198754;
    }

    .keynote-card.keynote-thu {
      border-top-color: #6f42c1;
    }

    .keynote-card::after {
      content: "";
      display: table;
      clear: both;
    }

    .keynote-card .keynote-photo {
      float: left;
      margin: 0 1.5rem 1rem 0;
      border-radius: 8px;
      border: 2px solid #dee2e6;
      width: 180px;
      height: auto;
    }

    .keynote-card .keynote-date {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fff;
      background: #0d6efd;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }

    .keynote-card.keynote-wed .keynote-date {
      background: #198754;
    }

    .keynote-card.keynote-thu .keynote-date {
      background: #6f42c1;
    }

    .keynote-card .keynote-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0 0 0.25rem 0;
    }

    .keynote-card .keynote-speaker {
      font-size: 1.05rem;
      font-style: italic;
      color: #495057;
      margin: 0 0 0.25rem 0;
    }

    .keynote-card .keynote-affiliation {
      font-size: 0.92rem;
      color: #6c757d;
      margin: 0 0 1rem 0;
      line-height: 1.5;
    }

    .keynote-card .keynote-affiliation a {
      color: #6c757d;
      text-decoration: underline;
    }

    .keynote-card .keynote-abstract {
      line-height: 1.7;
      color: #212529;
    }

    .keynote-card .keynote-abstract p {
      margin-bottom: 0.75rem;
    }

    .keynote-card .keynote-bio {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e9ecef;
    }

    .keynote-card .keynote-bio h4 {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6c757d;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
      .keynote-card .keynote-photo {
        float: none;
        display: block;
        margin: 0 auto 1rem auto;
      }
    }
  </style>

  <title>
    {% if page.title %} {{ page.title }} {% else %} PACT 2024 — {{
    site.data.vars.conf_dates }} {% endif %}
  </title>

  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script> -->
</head>
